version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sentio_postgres
    environment:
      POSTGRES_DB: sentio_db
      POSTGRES_USER: sentio
      POSTGRES_PASSWORD: sentio_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    networks:
      - sentio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentio -d sentio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentio_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - sentio_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentio_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://sentio:sentio_password@postgres:5432/sentio_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - media_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentio_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sentio_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - media_uploads:/var/www/uploads
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentio_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_uploads:

networks:
  sentio_network:
    driver: bridge
